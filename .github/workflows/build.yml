name: Build Makler

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            platform: macos-arm64
            artifact: Makler-macos-arm64
            archive: Makler-macos-arm64.zip

          - os: windows-latest
            platform: windows-x64
            artifact: Makler-windows-x64
            archive: Makler-windows-x64.zip

          - os: ubuntu-22.04
            platform: linux-x64
            artifact: Makler-linux-x64
            archive: Makler-linux-x64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Build application
        run: >
          uv run pyinstaller
          --noconfirm
          --clean
          --windowed
          --name Makler
          --paths src
          src/makler/main.py

      - name: Package macOS application
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            dist/Makler.app ${{ matrix.archive }}

      - name: Package Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path dist/Makler `
            -DestinationPath ${{ matrix.archive }} `
            -Force

      - name: Package Linux application
        if: runner.os == 'Linux'
        run: |
          tar -czf ${{ matrix.archive }} -C dist Makler

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release

    needs: build

    if: >
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-22.04

    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: release-assets/**/*